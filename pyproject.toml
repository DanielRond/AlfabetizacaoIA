[project]
name = "alfabetizacaoia"
version = "0.1.0"
description = "Curumim Marajoara - tutor de alfabetização inteligente via WhatsApp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "ollama>=0.6.2",
    "chromadb>=1.5.9",
    "gunicorn>=26.0.0",
    "google-genai>=2.8.0",
    "kokoro-onnx>=0.4.7",
    "soundfile>=0.12.1",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "nemo-toolkit[asr]>=2.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: testes que exigem serviços externos (Ollama, modelos, TTS)",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
